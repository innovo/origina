name: Android APK

# Builds the Origina Android app. Run it from GitHub: Actions > Android APK > Run workflow.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to users (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  build:
        runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21


      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Sync web assets and plugins
        run: npx cap sync android

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ORIGINA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add the ORIGINA_KEYSTORE_BASE64 secret first (see deployment steps)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/origina-release.jks"

      - name: Build signed APK and AAB
        working-directory: mobile/android
        env:
          ORIGINA_KEYSTORE_PATH: ${{ runner.temp }}/origina-release.jks
          ORIGINA_KEYSTORE_PASSWORD: ${{ secrets.ORIGINA_KEYSTORE_PASSWORD }}
          ORIGINA_KEY_ALIAS: ${{ secrets.ORIGINA_KEY_ALIAS }}
          ORIGINA_KEY_PASSWORD: ${{ secrets.ORIGINA_KEY_PASSWORD }}
          ORIGINA_VERSION_CODE: ${{ github.run_number }}
          ORIGINA_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Rename outputs
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk "../dist/Origina-${{ inputs.version_name }}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "../dist/Origina-${{ inputs.version_name }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: Origina-Android-${{ inputs.version_name }}
          path: dist/*
